route:
  receiver: agent
  group_by: ["alertname"]
  group_wait: 5s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: agent
    webhook_configs:
      - url: http://agent:8000/webhook/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/webhook_token
