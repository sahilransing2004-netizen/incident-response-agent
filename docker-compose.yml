name: incident-response-agent

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: incidents
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incidents"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  agent:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN}
      DATABASE_URL: postgresql+psycopg://incident:${POSTGRES_PASSWORD}@db:5432/incidents
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/webhook_token:/etc/alertmanager/webhook_token:ro
    ports:
      - "9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  promdata:
  grafanadata:
